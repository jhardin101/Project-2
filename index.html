<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A simple RPG adventure generator.">
        <title>Random Adventure Generator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="app">
        <header class="hero">
            <p class="eyebrow">RANDOM ADVENTURE GENERATOR</p>
            <h1>What awaits beyond the map?</h1>
            <p>
                Generate a unique fantasy encounter using local data and a remote API.
            </p>
            <button id="generate-button">Generate Adventure</button>
        </header>

        <section id="adventure-card" class="card">
            <p class="placeholder">
                Your generated adventure will appear here.
            </p>
        </section>

        <section class="history-section">
            <h2>Previous Adventures</h2>
            <ul id="history-list"></ul>
        </section>
        </main>

    <script src="script.js"></script>
    </body>
</html>
